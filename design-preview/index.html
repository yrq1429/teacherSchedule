<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教师手账 · 首页预览</title><link rel="stylesheet" href="preview.css?v=4"><style>*{box-sizing:border-box}body{margin:0}button{font:inherit;border:0}.phone{max-width:430px;margin:auto;background:#F6F5F1}.notice{padding:12px;background:#E0EBF3;color:#234E70;text-align:center;font-size:12px}.tabbar{display:flex;justify-content:space-around;padding:20px;border-top:1px solid #D7E2EB;background:#FCFDFE;font-size:13px;color:#65798B}.tabbar span:first-child{color:#234E70;font-weight:bold}.tabbar{border-top:1px solid #E2E4E1;padding:12px 8px 16px;background:#FFF;}.tab-item{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;color:#8B9296;font-size:11px;}.tab-item.selected{color:#263746;font-weight:600;}.tab-item img{width:23px;height:23px;}.tabbar span:first-child{font-weight:inherit;color:inherit}[hidden]{display:none!important}.date-cell{cursor:pointer}.notice{background:#ECEDEA;color:#747D83}</style></head><body><div class="phone"><div class="notice">演示数据 · 点击日期体验加载动效</div><div class="journal">
<div class="header"><div class="header-copy"><div class="eyebrow">中午好 · 教学手账</div><div class="journal-title">今天的课堂</div><div class="date-sub">课程安排与授课记录，一目了然。</div></div><div class="date-badge"><span class="badge-month">10 月</span><span class="badge-day">13</span><button class="today-btn">今天 ↗</button></div></div>
<div class="week-heading"><span>12日 - 18日</span><span>左右滑动切换周</span></div>
<div class="date-strip"><button class="week-arrow">‹</button><div class="date-cell"><span class="cell-week">一</span><span class="cell-num">12</span></div><div class="date-cell active"><span class="cell-week">二</span><span class="cell-num">13</span><div class="cell-dot"></div></div><div class="date-cell"><span class="cell-week">三</span><span class="cell-num">14</span></div><div class="date-cell"><span class="cell-week">四</span><span class="cell-num">15</span></div><div class="date-cell"><span class="cell-week">五</span><span class="cell-num">16</span></div><div class="date-cell"><span class="cell-week">六</span><span class="cell-num">17</span></div><div class="date-cell"><span class="cell-week">日</span><span class="cell-num">18</span></div><button class="week-arrow">›</button></div>
<div id="loading-demo" class="loading-panel" hidden aria-live="polite"><div class="loading-status"><div class="loading-spinner"></div><span>正在同步这一天的安排</span><div class="loading-dots"><div></div><div></div><div></div></div></div><div class="skeleton-summary"><div class="skeleton skeleton-number"></div><div class="skeleton skeleton-number"></div><div class="skeleton skeleton-number"></div></div><div class="skeleton-focus"><div class="skeleton skeleton-tag"></div><div class="skeleton-focus-body"><div class="skeleton skeleton-clock"></div><div class="skeleton-lines"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-subtitle"></div></div></div></div><div class="skeleton-list"><div class="skeleton-row"><div class="skeleton skeleton-time"></div><div class="skeleton-lines"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-subtitle"></div></div></div><div class="skeleton-row"><div class="skeleton skeleton-time"></div><div class="skeleton-lines"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-subtitle"></div></div></div><div class="skeleton-row"><div class="skeleton skeleton-time"></div><div class="skeleton-lines"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-subtitle"></div></div></div></div></div><main id="agenda-content"><div class="day-summary"><div class="summary-metric"><span class="metric-value">2<span class="metric-unit">节</span></span><span class="metric-label">当天安排</span></div><div class="summary-metric"><span class="metric-value">3<span class="metric-unit">h</span></span><span class="metric-label">计划授课</span></div><div class="summary-metric"><span class="metric-value">1<span class="metric-unit">/2</span></span><span class="metric-label">已打卡</span></div></div>
<div class="focus-card"><div class="focus-top"><div class="focus-label"><div class="live-dot"></div>下一节课</div><span class="focus-tag">英语</span></div><div class="focus-body"><div class="focus-clock"><div class="focus-time">14:00</div><div class="focus-end">至 15:30</div></div><div class="focus-info"><div class="focus-name">初二英语提高班</div><div class="focus-location">3 号教室</div></div></div><div class="focus-bottom"><span>课程安排 · 英语</span><span class="focus-link">课程详情 ↗</span></div></div>
<div class="section-line"><span class="section-name">今天的时间轴</span><span class="section-note">2 节课程</span></div>
<div class="timeline"><div class="lesson-row"><div class="time-column"><span class="start-time">09:00</span><span class="end-time">10:30</span></div><div class="timeline-dot" style="background:#666B86"></div><div class="course-card done"><div class="course-top"><span class="subject-label" style="color:#666B86">物理</span><button class="checkin checked">✓ 已授课</button></div><div class="course-name">物理一对一 · 力与运动</div><div class="course-bottom"><span>2 号教室</span><span>课程详情 ›</span></div></div></div><div class="lesson-row"><div class="time-column"><span class="start-time">14:00</span><span class="end-time">15:30</span></div><div class="timeline-dot" style="background:#92744F"></div><div class="course-card"><div class="course-top"><span class="subject-label" style="color:#92744F">英语</span><button class="checkin">上课打卡</button></div><div class="course-name">初二英语提高班</div><div class="course-bottom"><span>3 号教室</span><span>课程详情 ›</span></div></div></div></div>
</main><div class="fab-row"><button class="btn-ghost fab">导入课表 ↗</button><button class="btn-primary fab">＋ 新增课程</button></div><div class="page-signature">记录教学，也记录成长。</div></div><nav class="tabbar" aria-label="底部导航"><div class="tab-item selected"><img src="icons/tab-schedule-active-v3.png" alt=""><span>课表</span></div><div class="tab-item "><img src="icons/tab-feedback-v3.png" alt=""><span>反馈</span></div><div class="tab-item "><img src="icons/tab-stats-v3.png" alt=""><span>统计</span></div><div class="tab-item "><img src="icons/tab-profile-v3.png" alt=""><span>我的</span></div></nav></div><script>
let loadTimer;
const dateCells=document.querySelectorAll('.date-cell');
function selectDate(cell){
 dateCells.forEach(x=>x.classList.remove('active'));cell.classList.add('active');
 document.querySelector('.badge-day').textContent=cell.querySelector('.cell-num').textContent;
 document.getElementById('loading-demo').hidden=false;
 document.getElementById('agenda-content').hidden=true;
 clearTimeout(loadTimer);
 // Fixed delay only demonstrates the loading state; production uses actual request completion.
 loadTimer=setTimeout(()=>{document.getElementById('loading-demo').hidden=true;document.getElementById('agenda-content').hidden=false;},1800);
}
dateCells.forEach(cell=>{cell.setAttribute('role','button');cell.setAttribute('tabindex','0');cell.onclick=()=>selectDate(cell);cell.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectDate(cell);}};});
document.querySelector('.today-btn').onclick=()=>selectDate(dateCells[1]);
</script></body></html>
